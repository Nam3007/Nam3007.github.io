    <h2>Quadratic Equation</h2>

    <table border="1">
        <th >Quadratic</th>
        <tr><th>Ax<sup>2</sup> + Bx + C</th></tr>
        <tr scope="col">
            <td>A = </td>
            <td><input type="number" id ="a"></td>
            <td><button onclick="compute()">compute</button></td>
        </tr>
        <tr>
            <td>B = </td>
            <td><input type="number" id = "b"></td>
            <td>X1 = </td>
            <td id = "x1"></td>
        </tr>
        <tr>
            <td>C = </td>
            <td><input type="number" id = "c"></td>
            <td>X2 = </td>
            <td id = "x2"></td>
        </tr>

    </table>
    <script type="text/javascript">
        function compute(){
            var a = Number.parseFloat(document.getElementById("a").value);
            var b = Number.parseFloat(document.getElementById("b").value);
            var c = Number.parseFloat(document.getElementById("c").value);
            var x1, x2;
            
            var delta = b*b - 4*a*c;
            if (delta < 0){
                x1 = "No real root";
                x2 = "No real root";
            } else if (delta == 0){
                x1 = x2 = -b/(2*a);
            } else {
                x1 = (-b + Math.sqrt(delta))/(2*a);
                x2 = (-b - Math.sqrt(delta))/(2*a);
            }
            setTimeout(() => {
                document.getElementById("x1").innerText ="Thiên lí ơiii" ;
            },2000);

            setTimeout(()=>{
                document.getElementById("x2").innerText="Em có thể chơi pickle ball?"
            },4000)
            
            setTimeout(() => {
                document.getElementById("x1").innerText = " x1 có giá trị bằng cân nặng của mẹ bạn: " + x1 ;
                document.getElementById("x2").innerText = " x2 có giá trị bằng cân nặng của mẹ bạn: " + x2 ;
            },8000);
        }
    </script>

        <script type = "text/javascript">
            function populateDays(){
                var select = document.getElementById("day");
                for (var i = 1; i <= 31; i++){
                    var option = document.createElement("option");
                    option.value = i;
                    option.text = i;
                    select.appendChild(option);
                }
            }
            function populateMonths(){
                var select = document.getElementsByTagName("select")[1];
                var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                for (var i = 0; i < monthNames.length; i++){
                    var option = document.createElement("option");
                    option.value = i+1;
                    option.text = monthNames[i];
                    select.appendChild(option);
                }
            }
            function populateYears(){
                var select = document.getElementsByTagName("select")[2];
                for (var i = 1950; i <= 2023; i++){
                    var option = document.createElement("option");
                    option.value = i;
                    option.text = i;
                    select.appendChild(option);
                }
            }
        </script>
        <select id="day"> 
            <script type="text/javascript">populateDays()</script>
        </select>
        <select id = "month"   > 
            <script type="text/javascript">populateMonths()</script>    
        </select>
        <select id="year"> 
            <script type="text/javascript">populateYears()</script>
